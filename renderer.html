<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mermaid Renderer</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        background: #fff;
      }
      html.mode-scroll,
      html.mode-scroll body {
        height: 100%;
        overflow: auto;
      }
      html.mode-expand,
      html.mode-expand body {
        height: 100%;
        overflow: hidden;
      }
      body {
        padding: 0.5rem;
        box-sizing: border-box;
      }
      html.mode-expand body {
        padding: 0;
      }
      #viewport {
        position: relative;
        width: 100%;
      }
      html.mode-scroll #viewport {
        min-height: 0;
      }
      html.mode-expand #viewport {
        height: 100%;
        overflow: hidden;
        touch-action: none;
        cursor: grab;
        background: #fff;
      }
      html.theme-dark-bg,
      html.theme-dark-bg body,
      html.theme-dark-bg #viewport {
        background: #0f1419;
      }
      html.mode-expand #viewport.is-panning {
        cursor: grabbing;
      }
      #stage {
        transform-origin: 0 0;
        will-change: transform;
      }
      html.mode-scroll #stage {
        transform: none !important;
      }
      #root {
        width: 100%;
      }
      html.mode-expand #root {
        width: auto;
        box-sizing: border-box;
        padding: 0;
      }
      #root svg {
        max-width: 100%;
        width: 100%;
        height: auto;
        display: block;
        margin: 0 auto;
      }
      html.mode-expand #root svg {
        max-width: none !important;
        display: block;
      }
      .hint {
        margin: 2rem 0;
        text-align: center;
        color: #5c6b7a;
        font: 14px/1.4 "IBM Plex Sans", "Segoe UI", sans-serif;
      }
      .error {
        margin: 0.5rem;
        padding: 0.75rem 0.9rem;
        border: 1px solid #e2b4b4;
        background: #fff5f5;
        color: #a32020;
        border-radius: 6px;
        font: 14px/1.4 "IBM Plex Sans", "Segoe UI", sans-serif;
        white-space: pre-wrap;
      }
      #zoom-controls {
        display: none;
        position: absolute;
        right: 0.75rem;
        bottom: 0.75rem;
        z-index: 5;
        align-items: center;
        gap: 0.25rem;
        padding: 0.25rem;
        border: 1px solid #d5dbe3;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 4px 14px rgba(26, 35, 50, 0.12);
        font: 13px/1 "IBM Plex Sans", "Segoe UI", sans-serif;
      }
      html.mode-expand #zoom-controls {
        display: flex;
      }
      #zoom-controls button {
        width: 2rem;
        height: 2rem;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #1a2332;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #zoom-controls button:hover {
        background: #eef2f6;
      }
      #zoom-controls button:active {
        background: #e2e8ef;
      }
      #zoom-level {
        min-width: 3.25rem;
        text-align: center;
        color: #5c6b7a;
        font-variant-numeric: tabular-nums;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="viewport">
      <div id="stage">
        <div id="root"><p class="hint">O preview aparece aqui.</p></div>
      </div>
      <div id="zoom-controls" aria-label="Controles de zoom">
        <button type="button" id="zoom-out" title="Diminuir zoom" aria-label="Diminuir zoom">
          −
        </button>
        <span id="zoom-level">100%</span>
        <button type="button" id="zoom-in" title="Aumentar zoom" aria-label="Aumentar zoom">
          +
        </button>
        <button type="button" id="zoom-reset" title="Resetar zoom" aria-label="Resetar zoom">
          ⟲
        </button>
      </div>
    </div>
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.16.0/+esm";

      const DEFAULT_THEME = "neutral";
      const MERMAID_THEMES = new Set([
        "default",
        "neutral",
        "dark",
        "forest",
        "base",
        "neo",
        "neo-dark",
        "redux",
        "redux-dark",
        "redux-color",
        "redux-dark-color",
      ]);
      const MERMAID_BASE_CONFIG = {
        startOnLoad: false,
        securityLevel: "strict",
        flowchart: {
          // true: interpreta \n e <br/> nos rótulos (false mostrava "\n" literal).
          htmlLabels: true,
          useMaxWidth: true,
          nodeSpacing: 25,
          rankSpacing: 35,
          padding: 12,
        },
      };

      let currentTheme = "";

      function normalizeTheme(value) {
        const theme = String(value || "")
          .trim()
          .toLowerCase();
        return MERMAID_THEMES.has(theme) ? theme : DEFAULT_THEME;
      }

      function isDarkTheme(theme) {
        return /(^|-)dark(-|$)/.test(theme);
      }

      function applyMermaidTheme(theme) {
        const next = normalizeTheme(theme);
        if (next === currentTheme) {
          document.documentElement.dataset.mermaidTheme = currentTheme;
          document.documentElement.classList.toggle(
            "theme-dark-bg",
            isDarkTheme(currentTheme),
          );
          return currentTheme;
        }
        currentTheme = next;
        document.documentElement.dataset.mermaidTheme = currentTheme;
        document.documentElement.classList.toggle(
          "theme-dark-bg",
          isDarkTheme(currentTheme),
        );
        mermaid.initialize({
          ...MERMAID_BASE_CONFIG,
          theme: currentTheme,
        });
        return currentTheme;
      }

      applyMermaidTheme(DEFAULT_THEME);

      const viewport = document.getElementById("viewport");
      const stage = document.getElementById("stage");
      const root = document.getElementById("root");
      const zoomLevelEl = document.getElementById("zoom-level");
      const btnZoomIn = document.getElementById("zoom-in");
      const btnZoomOut = document.getElementById("zoom-out");
      const btnZoomReset = document.getElementById("zoom-reset");

      let renderCount = 0;
      let latestRequestId = 0;
      let chain = Promise.resolve();
      let expandMode = false;

      const MIN_SCALE = 0.05;
      const MAX_SCALE = 8;
      const ZOOM_STEP = 1.2;
      const FIT_PADDING = 32;
      const VIEW_NOTIFY_MS = 120;
      let scale = 1;
      let tx = 0;
      let ty = 0;
      /** @type {{ scale: number, cx: number, cy: number } | null} */
      let preferredView = null;
      let viewNotifyTimer = 0;
      let panPointerId = null;
      let panStartX = 0;
      let panStartY = 0;
      let panOriginX = 0;
      let panOriginY = 0;

      /**
       * Mermaid 11 não quebra linha com a sequência literal "\\n" nos rótulos.
       * Converte para <br/> (exige flowchart.htmlLabels: true).
       */
      function prepareMermaidCode(code) {
        if (!code) return code;
        return String(code).replace(/\\n/g, "<br/>");
      }

      function post(payload) {
        // Sandbox sem allow-same-origin → origin opaco ("null"); "*" é necessário.
        parent.postMessage(payload, "*");
      }

      function clampScale(value) {
        return Math.min(MAX_SCALE, Math.max(MIN_SCALE, value));
      }

      function normalizeView(view) {
        if (!view || typeof view !== "object") return null;
        const nextScale = clampScale(Number(view.scale));
        const cx = Number(view.cx);
        const cy = Number(view.cy);
        if (!Number.isFinite(nextScale) || nextScale <= 0) return null;
        if (!Number.isFinite(cx) || !Number.isFinite(cy)) return null;
        return { scale: nextScale, cx, cy };
      }

      function getWorldCenter() {
        const vw = viewport.clientWidth || 0;
        const vh = viewport.clientHeight || 0;
        const safeScale = scale > 0 ? scale : 1;
        return {
          cx: (vw / 2 - tx) / safeScale,
          cy: (vh / 2 - ty) / safeScale,
        };
      }

      function capturePreferredView() {
        if (!expandMode) {
          preferredView = null;
          return;
        }
        const { cx, cy } = getWorldCenter();
        preferredView = { scale, cx, cy };
      }

      function notifyViewChanged() {
        if (!expandMode) return;
        if (viewNotifyTimer) {
          window.clearTimeout(viewNotifyTimer);
          viewNotifyTimer = 0;
        }
        const { cx, cy } = getWorldCenter();
        post({
          type: "view-changed",
          scale,
          cx,
          cy,
        });
      }

      function scheduleViewNotify() {
        if (!expandMode) return;
        if (viewNotifyTimer) window.clearTimeout(viewNotifyTimer);
        viewNotifyTimer = window.setTimeout(() => {
          viewNotifyTimer = 0;
          notifyViewChanged();
        }, VIEW_NOTIFY_MS);
      }

      function applyTransform() {
        if (!expandMode) {
          stage.style.transform = "";
          zoomLevelEl.textContent = "100%";
          return;
        }
        stage.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
        zoomLevelEl.textContent = `${Math.round(scale * 100)}%`;
      }

      function applyView(view) {
        if (!expandMode) return false;
        const normalized = normalizeView(view);
        if (!normalized) return false;
        const vw = viewport.clientWidth;
        const vh = viewport.clientHeight;
        if (!(vw > 0 && vh > 0)) return false;
        scale = normalized.scale;
        tx = vw / 2 - normalized.cx * scale;
        ty = vh / 2 - normalized.cy * scale;
        preferredView = normalized;
        applyTransform();
        return true;
      }

      function resolveView(view = preferredView) {
        if (!expandMode) {
          applyTransform();
          return;
        }
        if (applyView(view)) {
          scheduleViewNotify();
          return;
        }
        fitToViewport();
        capturePreferredView();
        scheduleViewNotify();
      }

      function readSvgSize(svg) {
        const vb = svg.viewBox?.baseVal;
        if (vb && vb.width > 0 && vb.height > 0) {
          return { width: vb.width, height: vb.height };
        }
        const wAttr = svg.getAttribute("width");
        const hAttr = svg.getAttribute("height");
        const width = wAttr && !String(wAttr).endsWith("%") ? parseFloat(wAttr) : NaN;
        const height = hAttr && !String(hAttr).endsWith("%") ? parseFloat(hAttr) : NaN;
        if (Number.isFinite(width) && Number.isFinite(height) && width > 0 && height > 0) {
          return { width, height };
        }
        try {
          const box = svg.getBBox();
          if (box.width > 0 && box.height > 0) {
            return { width: box.width, height: box.height };
          }
        } catch {
          /* SVG ainda não layoutado */
        }
        return { width: 0, height: 0 };
      }

      function fitToViewport() {
        if (!expandMode) {
          applyTransform();
          return;
        }
        const svg = root.querySelector("svg");
        if (!svg) {
          scale = 1;
          tx = 0;
          ty = 0;
          applyTransform();
          return;
        }
        const { width, height } = readSvgSize(svg);
        const vw = viewport.clientWidth;
        const vh = viewport.clientHeight;
        if (!(width > 0 && height > 0 && vw > 0 && vh > 0)) {
          scale = 1;
          tx = 0;
          ty = 0;
          applyTransform();
          return;
        }
        const fit = Math.min(
          (vw - FIT_PADDING) / width,
          (vh - FIT_PADDING) / height,
        );
        scale = clampScale(fit > 0 ? fit : 1);
        tx = (vw - width * scale) / 2;
        ty = (vh - height * scale) / 2;
        applyTransform();
      }

      function resetView() {
        preferredView = null;
        fitToViewport();
        capturePreferredView();
        notifyViewChanged();
      }

      function zoomAt(nextScale, clientX, clientY) {
        if (!expandMode) return;
        const clamped = clampScale(nextScale);
        if (clamped === scale) return;

        const rect = viewport.getBoundingClientRect();
        const px = clientX - rect.left;
        const py = clientY - rect.top;
        const worldX = (px - tx) / scale;
        const worldY = (py - ty) / scale;
        scale = clamped;
        tx = px - worldX * scale;
        ty = py - worldY * scale;
        applyTransform();
        capturePreferredView();
        scheduleViewNotify();
      }

      function zoomBy(factor) {
        if (!expandMode) return;
        const rect = viewport.getBoundingClientRect();
        zoomAt(scale * factor, rect.left + rect.width / 2, rect.top + rect.height / 2);
      }

      function setMode(expand) {
        expandMode = Boolean(expand);
        document.documentElement.classList.toggle("mode-expand", expandMode);
        document.documentElement.classList.toggle("mode-scroll", !expandMode);
        if (!expandMode) {
          panPointerId = null;
          viewport.classList.remove("is-panning");
          preferredView = null;
          if (viewNotifyTimer) {
            window.clearTimeout(viewNotifyTimer);
            viewNotifyTimer = 0;
          }
          scale = 1;
          tx = 0;
          ty = 0;
          applyTransform();
        }
      }

      function measureHeight() {
        if (expandMode) {
          // Viewport fixo no parent; altura do iframe vem do CSS/viewport da página.
          return Math.max(120, Math.ceil(window.innerHeight || 120));
        }
        const svg = root.querySelector("svg");
        if (svg) {
          const rect = svg.getBoundingClientRect();
          return Math.max(120, Math.ceil(rect.height + 16));
        }
        return Math.max(
          120,
          Math.ceil(
            Math.max(root.scrollHeight, document.body.scrollHeight) + 8,
          ),
        );
      }

      async function waitForLayout() {
        await new Promise((resolve) =>
          requestAnimationFrame(() => requestAnimationFrame(resolve)),
        );
      }

      /**
       * Mermaid cria nós temporários no body (`#d{id}`, `#i{id}`) e, em erro de
       * sintaxe, deixa o SVG da “bombinha” lá. Cada render usa um id novo, então
       * sem limpeza ampla os erros se acumulam.
       */
      function clearMermaidArtifacts() {
        for (const node of [...document.body.children]) {
          if (node === viewport || node.tagName === "SCRIPT") continue;
          node.remove();
        }
        for (const node of [...viewport.children]) {
          if (node.id === "stage" || node.id === "zoom-controls") continue;
          node.remove();
        }
        // Fallback: qualquer residual de erro Mermaid ainda no documento.
        document
          .querySelectorAll("svg .error-icon, svg .error-text")
          .forEach((node) => {
            const host = node.closest("svg")?.parentElement || node.closest("svg");
            if (!host || host === root || root.contains(host)) return;
            host.remove();
          });
      }

      /** No expand, força tamanho em px (evita colapso width:% dentro do viewport). */
      function prepareExpandSvg() {
        if (!expandMode) return;
        const svg = root.querySelector("svg");
        if (!svg) return;
        const { width, height } = readSvgSize(svg);
        svg.style.maxWidth = "none";
        if (width > 0 && height > 0) {
          svg.setAttribute("width", String(width));
          svg.setAttribute("height", String(height));
          svg.style.width = `${width}px`;
          svg.style.height = `${height}px`;
        }
      }

      /** Volta ao layout fluido (scroll) ao desligar o modo zoom. */
      function restoreScrollSvg() {
        const svg = root.querySelector("svg");
        if (!svg) return;
        const { width, height } = readSvgSize(svg);
        if (width > 0 && height > 0) {
          svg.setAttribute("width", String(width));
          svg.setAttribute("height", String(height));
        }
        svg.style.maxWidth = "100%";
        svg.style.width = "100%";
        svg.style.height = "auto";
      }

      async function applyZoomMode(enabled, view = null) {
        const nextView = normalizeView(view);
        if (nextView) preferredView = nextView;
        setMode(Boolean(enabled));
        if (expandMode) {
          prepareExpandSvg();
          await waitForLayout();
          resolveView(preferredView);
        } else {
          restoreScrollSvg();
          await waitForLayout();
        }
        post({
          type: "zoom-mode-changed",
          zoom: expandMode,
          height: measureHeight(),
        });
      }

      async function renderDiagram(
        rawCode,
        requestId,
        expand,
        view = null,
        theme = currentTheme,
      ) {
        const t0 = performance.now();
        const code = prepareMermaidCode(rawCode);
        const nextView = normalizeView(view);
        applyMermaidTheme(theme);
        console.log("[renderer] start", {
          requestId,
          chars: code?.length || 0,
          expand,
          theme: currentTheme,
        });

        if (requestId !== latestRequestId) {
          post({ type: "render-result", requestId, ok: true, skipped: true });
          return;
        }

        if (nextView) preferredView = nextView;
        setMode(expand);
        renderCount += 1;
        const id = `r-${requestId}-${renderCount}`;
        root.replaceChildren();
        clearMermaidArtifacts();

        if (!code || !code.trim()) {
          root.innerHTML = '<p class="hint">O preview aparece aqui.</p>';
          await waitForLayout();
          post({
            type: "render-result",
            requestId,
            ok: true,
            height: measureHeight(),
            expand: expandMode,
          });
          return;
        }

        try {
          await new Promise((resolve) => setTimeout(resolve, 0));
          if (requestId !== latestRequestId) {
            clearMermaidArtifacts();
            post({ type: "render-result", requestId, ok: true, skipped: true });
            return;
          }

          console.log("[renderer] mermaid.render…", { requestId });
          const { svg } = await mermaid.render(id, code);
          console.log("[renderer] mermaid.done", {
            requestId,
            svgLen: svg.length,
            ms: Math.round(performance.now() - t0),
          });
          if (requestId !== latestRequestId) {
            clearMermaidArtifacts();
            post({ type: "render-result", requestId, ok: true, skipped: true });
            return;
          }

          root.innerHTML = svg;
          prepareExpandSvg();
          clearMermaidArtifacts();
          await waitForLayout();
          // Parent pode ainda estar ajustando a altura do iframe; espera um frame a mais.
          await waitForLayout();
          if (expandMode) {
            resolveView(preferredView);
          }
          const height = measureHeight();
          console.log("[renderer] layout", { requestId, height, ms: Math.round(performance.now() - t0) });
          post({
            type: "render-result",
            requestId,
            ok: true,
            height,
            expand: expandMode,
          });
        } catch (error) {
          const message = error?.message || String(error);
          console.error("[renderer] error", message);
          clearMermaidArtifacts();
          if (requestId !== latestRequestId) {
            post({ type: "render-result", requestId, ok: true, skipped: true });
            return;
          }
          root.innerHTML = "";
          const err = document.createElement("div");
          err.className = "error";
          err.textContent = message;
          root.appendChild(err);
          await waitForLayout();
          post({
            type: "render-result",
            requestId,
            ok: false,
            error: message,
            height: measureHeight(),
            expand: expandMode,
          });
        }
      }

      btnZoomIn.addEventListener("click", (event) => {
        event.stopPropagation();
        zoomBy(ZOOM_STEP);
      });
      btnZoomOut.addEventListener("click", (event) => {
        event.stopPropagation();
        zoomBy(1 / ZOOM_STEP);
      });
      btnZoomReset.addEventListener("click", (event) => {
        event.stopPropagation();
        resetView();
      });

      viewport.addEventListener("pointerdown", (event) => {
        if (!expandMode) return;
        if (event.target.closest("#zoom-controls")) return;
        if (event.button !== 0 && event.pointerType === "mouse") return;
        panPointerId = event.pointerId;
        panStartX = event.clientX;
        panStartY = event.clientY;
        panOriginX = tx;
        panOriginY = ty;
        viewport.classList.add("is-panning");
        viewport.setPointerCapture(event.pointerId);
      });

      viewport.addEventListener("pointermove", (event) => {
        if (!expandMode || panPointerId !== event.pointerId) return;
        tx = panOriginX + (event.clientX - panStartX);
        ty = panOriginY + (event.clientY - panStartY);
        applyTransform();
        capturePreferredView();
        scheduleViewNotify();
      });

      function endPan(event) {
        if (panPointerId !== event.pointerId) return;
        panPointerId = null;
        viewport.classList.remove("is-panning");
        try {
          viewport.releasePointerCapture(event.pointerId);
        } catch {
          /* already released */
        }
        if (expandMode) {
          capturePreferredView();
          notifyViewChanged();
        }
      }

      viewport.addEventListener("pointerup", endPan);
      viewport.addEventListener("pointercancel", endPan);

      viewport.addEventListener(
        "wheel",
        (event) => {
          if (!expandMode) return;
          event.preventDefault();
          const factor = event.deltaY < 0 ? ZOOM_STEP : 1 / ZOOM_STEP;
          zoomAt(scale * factor, event.clientX, event.clientY);
        },
        { passive: false },
      );

      window.addEventListener("message", (event) => {
        // Com origin opaco, confia só no event.source (parent).
        if (event.source !== parent) return;
        const data = event.data;
        if (!data) return;

        if (data.type === "ping") {
          post({ type: "renderer-ready" });
          return;
        }

        if (data.type === "fit-view") {
          void waitForLayout().then(() => {
            preferredView = null;
            resolveView(null);
          });
          return;
        }

        if (data.type === "set-view") {
          const nextView = normalizeView(data.view);
          if (nextView) preferredView = nextView;
          void waitForLayout().then(() => resolveView(preferredView));
          return;
        }

        if (data.type === "set-theme") {
          applyMermaidTheme(data.theme);
          return;
        }

        if (data.type === "set-zoom-mode") {
          void applyZoomMode(Boolean(data.enabled), data.view);
          return;
        }

        if (data.type === "remeasure") {
          void waitForLayout().then(() => {
            post({
              type: "render-result",
              requestId: data.requestId,
              ok: true,
              height: measureHeight(),
              expand: expandMode,
              remeasured: true,
            });
          });
          return;
        }

        if (data.type === "parse") {
          const { code, requestId } = data;
          chain = chain
            .catch(() => {})
            .then(async () => {
              try {
                const prepared = prepareMermaidCode(code);
                if (!prepared || !String(prepared).trim()) {
                  post({ type: "parse-result", requestId, ok: true });
                  return;
                }
                await mermaid.parse(prepared);
                post({ type: "parse-result", requestId, ok: true });
              } catch (error) {
                post({
                  type: "parse-result",
                  requestId,
                  ok: false,
                  error: error?.message || String(error),
                });
              }
            });
          return;
        }

        if (data.type !== "render") return;

        const { code, requestId, expand, view, theme } = data;
        latestRequestId = requestId;
        chain = chain
          .catch(() => {})
          .then(() =>
            renderDiagram(code, requestId, Boolean(expand), view, theme),
          );
      });

      setMode(false);
      post({ type: "renderer-ready" });
    </script>
  </body>
</html>
